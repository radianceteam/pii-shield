name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Each interpreter reports on its own; cancelling the rest on the first
      # failure hides whether a problem is version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # No NER extra here. This is not only about avoiding a 500 MB download: it is
      # the configuration the pattern-only tier actually runs in, so the job is what
      # keeps the test suite from quietly depending on the heavy extra. It has caught
      # exactly that once already.
      - run: uv pip install --system -e ".[dev,server,surrogates]"
      - run: ruff check .
      - run: pytest -q

  test-ner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv pip install --system -e ".[dev,ner,server,surrogates]"
      # One pipeline per language the live suite exercises. Russian gets the large
      # pipeline because it is the most heavily tested; the rest use small ones to keep
      # the job under a few minutes. Each language skips itself if its model is absent,
      # so a failure here means a real regression, never a missing download.
      - name: Install spaCy pipelines
        run: |
          for m in ru_core_news_lg en_core_web_sm zh_core_web_sm ja_core_news_sm ko_core_news_sm; do
            uv pip install --system "https://github.com/explosion/spacy-models/releases/download/$m-3.8.0/$m-3.8.0-py3-none-any.whl"
          done
      - run: pytest -q
