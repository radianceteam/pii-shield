[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-shield"
version = "0.2.0"
description = "Reversible PII detection and pseudonymization for text leaving for cloud LLM providers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "Radiance Team"}]
keywords = ["pii", "anonymization", "pseudonymization", "llm", "privacy", "gdpr", "presidio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Named-entity detection (people, organizations, locations). Without this extra the
# shield runs pattern-only: secrets and structured identifiers, no names.
ner = [
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    # The Russian lemmatizer walks a dictionary for every token, and pymorphy3 does
    # that in pure Python unless this is installed — it was 60% of what remained after
    # the other costs were dealt with. Same dictionary, same answers, compiled. Only
    # where a wheel exists; the pure-Python reader stays as the fallback.
    "DAWG2>=0.9.0,<1.0.0; platform_python_implementation == 'CPython'",
]
# Realistic surrogates ("Thomas Mueller") instead of <PERSON> placeholders.
surrogates = ["faker>=30.0"]
# HTTP sidecar for non-Python consumers.
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/radianceteam/pii-shield"
Issues = "https://github.com/radianceteam/pii-shield/issues"

[project.scripts]
pii-shieldd = "pii_shieldd.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
